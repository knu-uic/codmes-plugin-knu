name: Publish KNU plugin to Codmes Marketplace

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: marketplace-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      MARKETPLACE_REPOSITORY: ${{ github.repository_owner }}/Codmes-Marketplace
      PUBLISHER_ID: kr.ac.kongju.knu
      PACKAGE_DIRECTORY: knu-plugin
    steps:
      - name: Checkout released plugin source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: plugin

      - name: Checkout Marketplace
        uses: actions/checkout@v6
        with:
          repository: ${{ env.MARKETPLACE_REPOSITORY }}
          token: ${{ secrets.MARKETPLACE_AUTOMATION_TOKEN }}
          path: marketplace
          fetch-depth: 0

      - name: Checkout pinned Codmes Publisher CLI
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/Codmes
          ref: 05a9ecec754d
          path: codmes

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install Publisher CLI dependencies
        working-directory: codmes
        run: npm install --ignore-scripts

      - name: Read and validate release version
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./plugin/plugin.json').version")"
          test -n "$version"
          case "$RELEASE_TAG" in
            *"$version"*) ;;
            *) echo "Release tag $RELEASE_TAG does not contain plugin version $version" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "branch=release/knu-plugin-$version" >> "$GITHUB_OUTPUT"

      - name: Restore KNU Publisher signing key
        env:
          PLUGIN_SIGNING_KEY: ${{ secrets.CODMES_PLUGIN_SIGNING_KEY }}
        shell: bash
        run: |
          test -n "$PLUGIN_SIGNING_KEY"
          umask 077
          printf '%s' "$PLUGIN_SIGNING_KEY" > plugin-signing-key.pem

      - name: Read GitHub Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json body \
            --jq '.body // ""' > release-notes.md

      - name: Build signed package and update Registry
        shell: bash
        run: |
          node codmes/bin/codmes.mjs plugin publisher prepare plugin \
            --sign-key plugin-signing-key.pem \
            --publisher-id "$PUBLISHER_ID" \
            --package-directory "$PACKAGE_DIRECTORY" \
            --registry marketplace/registry/index.json \
            --release-notes-file release-notes.md

      - name: Verify Marketplace package and Registry
        shell: bash
        run: |
          node codmes/bin/codmes.mjs plugin registry validate \
            --registry marketplace/registry/index.json \
            --production \
            --verify-assets

      - name: Attach the exact Marketplace package to the Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          package="marketplace/registry/packages/$PACKAGE_DIRECTORY/${{ steps.release.outputs.version }}.codmes-plugin"
          gh release upload "$RELEASE_TAG" "$package" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Commit and push Marketplace release branch
        id: marketplace
        working-directory: marketplace
        shell: bash
        run: |
          branch="${{ steps.release.outputs.branch }}"
          git config user.name "codmes-marketplace[bot]"
          git config user.email "codmes-marketplace[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add registry/index.json "registry/packages/$PACKAGE_DIRECTORY/${{ steps.release.outputs.version }}.codmes-plugin"
          if git diff --cached --quiet; then
            echo "Marketplace already contains this exact release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "release: publish KNU plugin ${{ steps.release.outputs.version }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          git push --force-with-lease origin "HEAD:$branch"

      - name: Open or reuse Marketplace Pull Request
        if: steps.marketplace.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_AUTOMATION_TOKEN }}
        shell: bash
        run: |
          branch="${{ steps.release.outputs.branch }}"
          existing="$(gh pr list \
            --repo "$MARKETPLACE_REPOSITORY" \
            --head "$branch" \
            --state open \
            --json url \
            --jq '.[0].url // ""')"
          if test -n "$existing"; then
            echo "Marketplace PR already exists: $existing"
          else
            gh pr create \
              --repo "$MARKETPLACE_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "release: KNU plugin ${{ steps.release.outputs.version }}" \
              --body "KNU plugin GitHub Release \`$RELEASE_TAG\`에서 자동 생성한 Marketplace 업데이트입니다. 패키지 서명, SHA-256 및 Registry 검증을 통과했습니다."
          fi

      - name: Remove restored signing key
        if: always()
        run: rm -f plugin-signing-key.pem
